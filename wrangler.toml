# Cloudflare Pages Deployment Config
# Deploy: npx wrangler pages deploy dist --project-name=smarthome-vn-budget

name = "smarthome-vn-budget"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Environment variables (set in Cloudflare Pages dashboard)
# [env.production.vars]
# GA4_MEASUREMENT_ID = "G-XXXXXXXXXX"
# UMAMI_WEBSITE_ID = "xxx"
# SITE_URL = "https://smarthomevn.pages.dev"

# Build command (handled by Cloudflare Pages automatically)
# build_command = "npm run build"

# Redirects (handled by _redirects file in public/)
# [[redirects]]
# from = "/go/*"
# to = "/api/redirect/:splat"
# status = 302

# Headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.jpg"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.png"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.webp"
[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.avif"
[headers.values]
Cache-Control = "public, max-age=86400"